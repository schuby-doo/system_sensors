name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version without the v prefix (tag vX.Y.Z must exist)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Gleiche Gruppe wie weekly-rebuild.yml, damit nie zwei Runs gleichzeitig :latest setzen.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    # Nativ auf ARM bauen, das Image gibt es nur fuer linux/arm64 (kein QEMU noetig).
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Determine version
        id: version
        shell: bash
        env:
          # Ueber env statt direkt im Skript, um Script Injection zu vermeiden.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Immer den Release-Tag bauen, auch beim manuellen Start (sonst wuerde der
      # Stand des gewaehlten Branches unter der Release-Version veroeffentlicht).
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
      - uses: docker/setup-buildx-action@v4
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/schuby-doo/system_sensors
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }},prefix=v
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/schuby-doo/system_sensors
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

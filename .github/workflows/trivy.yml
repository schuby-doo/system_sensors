name: Weekly security scan

on:
  schedule:
    - cron: '33 22 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan source and container
    runs-on: ubuntu-26.04-arm
    # Rechte auf Job-Ebene ersetzen die Workflow-Ebene komplett, daher packages: read hier.
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # pip-audit loest requirements.txt in einer eigenen venv auf, eine vorherige
      # Installation der Abhaengigkeiten ist nicht noetig.
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
#          severity: CRITICAL
#          exit-code: "1"

      - name: Upload filesystem scan
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      # Trivy nutzt die Docker-Credentials; noetig, falls das GHCR-Paket privat ist.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ghcr.io/schuby-doo/system_sensors:latest
          format: sarif
          output: trivy-image.sarif
#          severity: CRITICAL
#          exit-code: "1"

      - name: Upload image scan
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

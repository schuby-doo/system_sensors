name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Create or update release PR
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          # Tags/releases created with GITHUB_TOKEN do not trigger other workflows
          # (e.g. docker-publish.yml). Store a PAT / GitHub App token as secret
          # RELEASE_PLEASE_TOKEN; until then it falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: false

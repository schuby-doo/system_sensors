name: Weekly image rebuild

# Baut das Image des letzten Release-Tags ohne Cache neu (frische Alpine-/pip-Patches)
# und veroeffentlicht es als :latest. Laeuft vor dem Trivy-Scan (trivy.yml, Fr 22:33 UTC).
on:
  schedule:
    - cron: "0 18 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Gleiche Gruppe wie docker-publish.yml, damit nie zwei Runs gleichzeitig :latest setzen.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild and publish latest
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check out latest release tag
        id: tag
        shell: bash
        run: |
          tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No release tag found"; exit 1; }
          git checkout --detach "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/schuby-doo/system_sensors
          tags: |
            type=raw,value=latest
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/schuby-doo/system_sensors
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

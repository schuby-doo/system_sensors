version: 2

updates:
  # Docker Base Image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      # interval: "weekly"
    # ignore:
    # - dependency-name: "python"
    #   versions:
    #     - ">= 3.11"
    open-pull-requests-limit: 5

  # Python dependencies aus requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      # interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions selbst aktuell halten
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      # interval: "weekly"
    open-pull-requests-limit: 5
